<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0a0a0f; --surface:#111118; --border:#1e1e2e; --accent:#f0c040; --text:#e8e8f0; --muted:#666680; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
    h1{font-family:'Syne',sans-serif;font-size:80px;font-weight:800;color:var(--accent);line-height:1}
    p{margin-top:16px;color:var(--muted);font-size:14px}
    a{color:var(--accent);text-decoration:none;display:inline-block;margin-top:24px;font-family:'Syne',sans-serif;font-weight:700}
  </style>
</head>
<body>
  <h1>404</h1>
  <p>This short link doesn't exist or has expired.</p>
  <a href="/">← Go back home</a>
</body>
</html>
