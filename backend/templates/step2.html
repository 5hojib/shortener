<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almost there — Step 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e;
      --accent: #f0c040; --text: #e8e8f0; --muted: #666680; --green: #39d98a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      background-image:
        radial-gradient(ellipse at 80% 20%, rgba(57,217,138,0.05) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 80%, rgba(240,192,64,0.06) 0%, transparent 60%);
    }
    .noise {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px; opacity: 0.5;
    }
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 520px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 44px 40px;
      box-shadow: 0 0 80px rgba(57,217,138,0.04), 0 40px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .logo {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 32px;
      display: flex; align-items: center; gap: 8px;
    }
    .logo-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; display:inline-block; }
    .steps { display: flex; gap: 8px; margin-bottom: 28px; }
    .step-dot { flex: 1; height: 3px; border-radius: 2px; background: var(--border); }
    .step-dot.done { background: var(--green); }
    .step-dot.active { background: var(--accent); }
    h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(24px,4.5vw,32px); line-height: 1.15; margin-bottom: 10px; }
    h1 span { color: var(--green); }
    p.sub { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 32px; }
    .ad-slot {
      width: 100%; min-height: 100px;
      border: 1px dashed var(--border); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 28px;
    }
    .timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 28px; }
    .ring-container { position: relative; width: 110px; height: 110px; }
    .ring-container svg { transform: rotate(-90deg); width: 110px; height: 110px; }
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 5; }
    .ring-fg {
      fill: none; stroke: var(--green); stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 307;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }
    .ring-number {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 800;
      color: var(--green);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 16px 28px;
      border: none; border-radius: 10px;
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
      letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s; text-decoration: none;
    }
    .btn-go { background: var(--green); color: #0a0a0f; }
    .btn-go:hover:not(:disabled) {
      background: #4dffaa; transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(57,217,138,0.3);
    }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .waiting-label { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .success-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(57,217,138,0.08); border: 1px solid rgba(57,217,138,0.2);
      border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: var(--green);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="noise"></div>
<div class="card">
  <div class="logo"><span class="logo-dot"></span> LinkFlow</div>

  <div class="steps">
    <div class="step-dot done"></div>
    <div class="step-dot active"></div>
    <div class="step-dot"></div>
  </div>

  <div class="success-badge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    Step 1 completed
  </div>

  <h1>Step <span>02</span> of 02</h1>
  <p class="sub">One more moment. Your destination link will be ready in just a few seconds.</p>

  <!-- AD SLOT — replace with your ad code -->
  <div class="ad-slot" id="adSlot2">
    <!-- AD UNIT HERE -->
    <span>Advertisement</span>
  </div>

  <div class="timer-wrap">
    <div class="ring-container">
      <svg viewBox="0 0 110 110">
        <circle class="ring-bg" cx="55" cy="55" r="48.9"/>
        <circle class="ring-fg" id="ring2" cx="55" cy="55" r="48.9"/>
      </svg>
      <div class="ring-number" id="countdown2">10</div>
    </div>
  </div>

  <button class="btn btn-go" id="goBtn" disabled onclick="window.location='{{.goURL}}'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8l4 4-4 4M8 12h8"/>
    </svg>
    Go to Destination
  </button>
  <p class="waiting-label pulse" id="waitLabel2">Unlocking your link…</p>
</div>

<script>
  const TOTAL = 10;
  const circumference = 2 * Math.PI * 48.9;
  const ring = document.getElementById('ring2');
  const countdown = document.getElementById('countdown2');
  const btn = document.getElementById('goBtn');
  const label = document.getElementById('waitLabel2');
  let remaining = TOTAL;

  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = 0;

  const tick = () => {
    remaining--;
    countdown.textContent = remaining;
    const progress = (TOTAL - remaining) / TOTAL;
    ring.style.strokeDashoffset = circumference * progress;
    if (remaining <= 0) {
      ring.style.strokeDashoffset = circumference;
      countdown.textContent = '✓';
      countdown.style.fontSize = '22px';
      btn.disabled = false;
      label.textContent = '🎉 Your link is ready!';
      label.style.color = '#39d98a';
      label.style.animation = 'none';
      clearInterval(timer);
    }
  };
  const timer = setInterval(tick, 1000);
</script>
</body>
</html>
